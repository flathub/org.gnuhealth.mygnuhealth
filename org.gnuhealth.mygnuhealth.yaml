  - name: python3-kivy
    buildsystem: simple
    build-commands:
      # Since python version detection is still broken and the PY2 codepath still exists in Kivy
      # we still need to patch that to ensure PY3 codepath
      - tar -xzvf kivy-2.3.2.tar.gz && rm kivy-2.3.2.tar.gz
      - patch -p0 < kivy-2.3.2-py2-condition.patch
      - tar -czvf kivy-2.3.2.tar.gz Kivy-2.3.2
