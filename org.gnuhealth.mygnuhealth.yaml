      - tar -xzvf Kivy-2.3.1.tar.gz && rm Kivy-2.3.1.tar.gz
      - patch -p0 < fix-build-for-cython-3.1.0.patch
      - tar -czvf Kivy-2.3.1.tar.gz Kivy-2.3.1
